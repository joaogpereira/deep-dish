<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsividade -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Título da aplicação -->
    <title>Deep Dish</title>

    <!-- Descrição SEO -->
    <meta
      name="description"
      content="Deep Dish é uma plataforma que permite reservar mesas em restaurantes e evitar filas, proporcionando uma experiência mais rápida e organizada."
    />

    <!-- Autor -->
    <meta name="author" content="Deep Dish Team" />

    <!-- Open Graph (para quando compartilhar link) -->
    <meta property="og:title" content="Deep Dish - Reservas Inteligentes para Restaurantes" />
    <meta
      property="og:description"
      content="Reserve mesas em restaurantes, evite filas e tenha uma experiência gastronômica mais prática com Deep Dish."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Deep Dish - Reservas Inteligentes para Restaurantes" />
    <meta
      name="twitter:description"
      content="Evite filas em restaurantes com o Deep Dish. Faça reservas e aproveite sua experiência gastronômica."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.ico" />
  </head>

  <body>
    <div id="root"></div>

    <!-- React / Vite -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
