services:
  backend:
    build:
      context: ./deep-dish-backend
    ports:
      - "8000:8000"
    volumes:
      - ./deep-dish-backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    env_file:
      - ./deep-dish-backend/.env
    command: >
      sh -c "composer install --no-interaction --prefer-dist --quiet
      && php artisan storage:link --force
      && php artisan serve --host=0.0.0.0 --port=8000"
    restart: unless-stopped

  queue:
    build:
      context: ./deep-dish-backend
    volumes:
      - ./deep-dish-backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    env_file:
      - ./deep-dish-backend/.env
    command: >
      sh -c "composer install --no-interaction --prefer-dist --quiet
      && php artisan queue:work --tries=3 --sleep=3"
    depends_on:
      - backend
    restart: unless-stopped

  # Roda as tarefas de routes/console.php (reservas:expirar, fila:expirar-chamados).
  # Sem ele nada agendado executa sozinho no Docker.
  scheduler:
    build:
      context: ./deep-dish-backend
    volumes:
      - ./deep-dish-backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    env_file:
      - ./deep-dish-backend/.env
    command: >
      sh -c "composer install --no-interaction --prefer-dist --quiet
      && php artisan schedule:work"
    depends_on:
      - backend
    restart: unless-stopped

  reverb:
    build:
      context: ./deep-dish-backend
    ports:
      - "8081:8081"
    volumes:
      - ./deep-dish-backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    env_file:
      - ./deep-dish-backend/.env
    command: >
      sh -c "composer install --no-interaction --prefer-dist --quiet
      && php artisan reverb:start --host=0.0.0.0 --port=8081"
    depends_on:
      - backend
    restart: unless-stopped

  # Banco de teste local, descartável — espelha o Postgres efêmero da CI
  # (.github/workflows/ci.yml). Nao entra em depends_on de nada: e opt-in,
  # so sobe quando alguem for rodar a suite localmente contra Postgres.
  # Dados nao sao persistidos em volume de proposito (descartavel de verdade).
  postgres_test:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: deepdish_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./deep-dish-frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "8080:8080"
    command: sh -c "npm install --silent && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped

volumes:
  frontend_node_modules:
  backend_vendor: